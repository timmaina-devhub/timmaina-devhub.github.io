<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="google-site-verification" content="vtORn6yX8CuDjrS8jfSbl-rl-m00ceHlC8UD1No4310" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}Dependable, trustworthy, self-taught problem solver from Nairobi. Applied data projects, leadership, and operational excellence.{% endif %}" />
    <title>{{ page.title }} | TimothyMaina</title>
    <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    {{ content }}
    <script>
      document.querySelectorAll('.nav-toggle').forEach(btn => {
        btn.addEventListener('click', () => {
          const links = btn.closest('.navbar').querySelector('.nav-links');
          if (links) {
            links.classList.toggle('nav-open');
            const open = links.classList.contains('nav-open');
            btn.setAttribute('aria-expanded', String(open));
          }
        });
      });
      document.querySelectorAll('.nav-links a').forEach(a => {
        a.addEventListener('click', () => {
          const btn = a.closest('.navbar')?.querySelector('.nav-toggle');
          const links = a.closest('.navbar')?.querySelector('.nav-links');
          if (links && btn) {
            links.classList.remove('nav-open');
            btn.setAttribute('aria-expanded', 'false');
          }
        });
      });
    </script>
  </body>
</html>
